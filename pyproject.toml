[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sts-geo-layout"
version = "0.1.0"
description = "Nominal STS ladder layouts and geometry-generation exports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "sts-utils>=0.1.0,<0.2.0"]

[project.optional-dependencies]
assembly = ["psycopg2-binary>=2.9"]
plot = ["matplotlib>=3.5"]
export = ["PyYAML>=6"]
test = ["pytest>=7", "matplotlib>=3.5", "PyYAML>=6"]

[project.scripts]
sts-geo-layout = "sts_geo_layout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
